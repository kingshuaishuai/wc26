name: Build & Deploy OracleXI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"   # 每3小时：拉最新比分→重建→部署到 Cloudflare Pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update results (best-effort)
        run: python update_results.py || echo "update skipped"
      - name: Build site
        env:
          ADSENSE_PUB: ${{ secrets.ADSENSE_PUB }}
        run: python build.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=oraclexi --branch=main --commit-dirty=true
      - name: Submit IndexNow (best-effort)
        run: python indexnow_submit.py || echo "indexnow skipped"
