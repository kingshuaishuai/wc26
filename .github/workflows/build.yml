name: Build & Deploy OracleXI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"   # 每3小时：拉最新比分→重建→部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update results (best-effort)
        run: python update_results.py || echo "update skipped"
      - name: Build site
        run: python build.py
      - name: Submit IndexNow (best-effort)
        run: python indexnow_submit.py || echo "indexnow skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
